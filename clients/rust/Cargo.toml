[package]
name = "grpc_sample_client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "send_message"
path = "src/send_message.rs"

[[bin]]
name = "send_bulk"
path = "src/send_bulk.rs"

[[bin]]
name = "get_history"
path = "src/get_history.rs"

[[bin]]
name = "live_chat"
path = "src/live_chat.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
tonic = "0.13"
prost = "0.13" # not the latest but the ones that works with tonic 0.13

[build-dependencies]
tonic-build = "0.13"
